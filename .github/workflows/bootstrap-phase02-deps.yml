name: Bootstrap Phase 02 dependencies

on:
  push:
    branches: [ feat/rss-sitemap ]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/rss-sitemap

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned Astro discovery packages
        run: npm install --save-exact @astrojs/rss@4.0.19 @astrojs/sitemap@3.7.4

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-phase02-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-phase02-deps.yml
          git commit -m "build: add RSS and sitemap dependencies"
          git push origin HEAD:feat/rss-sitemap
