name: Bootstrap Phase 04 dependencies

on:
  push:
    branches: [ feat/social-preview-cards ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/social-preview-cards

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned social-card dependencies
        run: npm install --save-dev --save-exact @resvg/resvg-js@2.6.2 @fontsource/inter@5.3.0

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-phase04-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-phase04-deps.yml
          git commit -m "build: add social card generation dependencies"
          git push origin HEAD:feat/social-preview-cards
