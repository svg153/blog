name: Bootstrap publishing dependency

on:
  push:
    branches: [ feat/publishing-pipeline ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/publishing-pipeline

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned YAML parser
        run: npm install --save-dev --save-exact yaml@2.9.1

      - name: Verify audit
        run: npm audit --audit-level=high

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-publishing-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-publishing-deps.yml
          git commit -m "build: add publishing frontmatter parser"
          git push origin HEAD:feat/publishing-pipeline
