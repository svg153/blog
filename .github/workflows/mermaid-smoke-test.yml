name: Mermaid smoke test

on:
  push:
    branches:
      - chore/use-astro-mermaid

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/use-astro-mermaid

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create temporary Mermaid content fixture
        shell: bash
        run: |
          cat > src/content/blog/__mermaid-smoke.md <<'EOF'
          ---
          title: "Mermaid smoke test"
          description: "Temporary CI-only Mermaid fixture"
          date: "2026-09-15"
          tags: ["test"]
          featured: false
          readingTime: "1"
          ---

          ```mermaid
          flowchart LR
            Source --> Astro
            Astro --> Mermaid
            Mermaid --> Diagram
          ```
          EOF

          cat > src/pages/__mermaid-smoke.astro <<'EOF'
          ---
          import Layout from '@layouts/Layout.astro';
          import { getEntry, render } from 'astro:content';

          const post = await getEntry('blog', '__mermaid-smoke');
          if (!post) throw new Error('Could not find Mermaid smoke-test content');
          const { Content } = await render(post);
          ---

          <Layout title="Mermaid smoke test">
            <Content />
          </Layout>
          EOF

      - name: Build with Astro
        run: npm run build

      - name: Verify Mermaid transformation
        shell: bash
        run: |
          test -f dist/__mermaid-smoke/index.html
          grep -q 'class="mermaid"' dist/__mermaid-smoke/index.html
          if grep -q 'language-mermaid' dist/__mermaid-smoke/index.html; then
            echo "Mermaid block was left as a normal syntax-highlighted code fence."
            exit 1
          fi

      - name: Remove temporary workflow after success
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/mermaid-smoke-test.yml
          git add .github/workflows/mermaid-smoke-test.yml
          git commit -m "ci: remove temporary Mermaid smoke test"
          git push
