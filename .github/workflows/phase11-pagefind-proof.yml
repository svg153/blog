name: Phase 11 unpublished search proof

on:
  push:
    branches: [ feat/pagefind-search ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 11 branch
        uses: actions/checkout@v6
        with:
          ref: feat/pagefind-search

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject unpublished fixtures
        shell: bash
        run: |
          cat > src/content/blog/__phase11-draft-proof.md <<'EOF'
          ---
          title: "PHASE11 DRAFT SEARCH LEAK PROOF"
          description: "PHASE11_DRAFT_MARKER_71FCA9"
          date: "2026-09-17"
          draft: true
          tags: ["phase11-draft-proof-tag"]
          featured: false
          ---

          ## Draft proof

          PHASE11_DRAFT_MARKER_71FCA9 must never enter production search.
          EOF

          cat > src/content/blog/__phase11-future-proof.md <<'EOF'
          ---
          title: "PHASE11 FUTURE SEARCH LEAK PROOF"
          description: "PHASE11_FUTURE_MARKER_84DB32"
          date: "2099-01-01"
          draft: false
          tags: ["phase11-future-proof-tag"]
          featured: false
          ---

          ## Future proof

          PHASE11_FUTURE_MARKER_84DB32 must never enter production search.
          EOF

      - name: Build and run all validators with fixtures present
        run: npm run build

      - name: Prove unpublished fixtures cannot leak
        shell: bash
        run: |
          test ! -e dist/posts/__phase11-draft-proof/index.html
          test ! -e dist/posts/__phase11-future-proof/index.html
          test ! -e dist/og/__phase11-draft-proof.png
          test ! -e dist/og/__phase11-future-proof.png
          test ! -e dist/tags/phase11-draft-proof-tag/index.html
          test ! -e dist/tags/phase11-future-proof-tag/index.html
          test ! -d dist/preview

          if grep -R -I -n -E 'PHASE11_(DRAFT|FUTURE)_MARKER_' dist --include='*.html'; then
            echo "Unpublished marker leaked into generated HTML"
            exit 1
          fi

          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const entry = JSON.parse(readFileSync('dist/pagefind/pagefind-entry.json', 'utf8'));
          const count = Object.values(entry.languages ?? {})
            .reduce((sum, language) => sum + Number(language.page_count ?? 0), 0);
          if (count !== 5) {
            throw new Error(`Expected exactly 5 published Pagefind pages with fixtures present, got ${count}`);
          }
          console.log('Unpublished Pagefind leak proof passed with 5/7 source articles indexed.');
          EOF

      - name: Remove temporary proof and workflow
        shell: bash
        run: |
          rm -f src/content/blog/__phase11-draft-proof.md src/content/blog/__phase11-future-proof.md
          rm .github/workflows/phase11-pagefind-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase11-pagefind-proof.yml
          git commit -m "test: remove completed Phase 11 Pagefind proof"
          git push origin HEAD:feat/pagefind-search
