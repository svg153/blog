name: Validate Skills Mermaid diagrams

on:
  push:
    branches:
      - content/mermaid-skills-over-mcp

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: content/mermaid-skills-over-mcp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source Mermaid fences
        shell: bash
        run: |
          ARTICLE='src/content/blog/skills-over-mcp-tools-know-how.md'
          COUNT=$(grep -c '^```mermaid$' "$ARTICLE")
          test "$COUNT" -eq 4
          if grep -q '^```text$' "$ARTICLE"; then
            echo 'An old text architecture diagram remains in the article.'
            exit 1
          fi

      - name: Build with Astro
        run: npm run build

      - name: Verify article transformations
        shell: bash
        run: |
          ARTICLE='dist/posts/skills-over-mcp-tools-know-how/index.html'
          test -f "$ARTICLE"
          COUNT=$(grep -o 'class="mermaid"' "$ARTICLE" | wc -l)
          test "$COUNT" -eq 4
          if grep -q 'language-mermaid' "$ARTICLE"; then
            echo 'A Mermaid fence remained as a normal code block.'
            exit 1
          fi

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/validate-skills-mermaid.yml
          git add .github/workflows/validate-skills-mermaid.yml
          git commit -m "ci: remove temporary Skills Mermaid validation"
          git push
