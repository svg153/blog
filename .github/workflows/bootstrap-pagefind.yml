name: Bootstrap Pagefind dependency

on:
  push:
    branches: [ feat/pagefind-search ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/pagefind-search
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Pagefind
        run: npm install --save-dev --save-exact pagefind@1.5.2
      - name: Verify audit
        run: npm audit --audit-level=high
      - name: Commit dependency and remove bootstrap
        run: |
          rm .github/workflows/bootstrap-pagefind.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-pagefind.yml
          git commit -m "build: add Pagefind 1.5.2"
          git push origin HEAD:feat/pagefind-search
