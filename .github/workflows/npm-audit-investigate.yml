name: Validate npm audit remediation

on:
  push:
    branches:
      - chore/npm-audit-remediation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/npm-audit-remediation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only

      - name: Apply compatible audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Validate clean install
        run: npm ci

      - name: Require clean npm audit
        run: npm audit

      - name: Build with Astro
        run: npm run build

      - name: Show remediated versions
        run: npm ls astro js-yaml nanoid postcss sharp smol-toml svgo

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/npm-audit-investigate.yml
          git add package-lock.json .github/workflows/npm-audit-investigate.yml
          git commit -m "chore: refresh lockfile after Astro security update"
          git push
