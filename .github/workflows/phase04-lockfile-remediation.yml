name: Phase 04 lockfile remediation

on:
  push:
    branches: [ feat/social-preview-cards ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/social-preview-cards

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Refresh vulnerable transitive dependency
        run: npm audit fix --package-lock-only

      - name: Clean install
        run: npm ci

      - name: Require zero audit findings
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); const v=a.metadata?.vulnerabilities ?? {}; if ((v.total ?? 0) !== 0) { console.error(v); process.exit(1) }"
          rm audit.json

      - name: Build and validate Phase 04
        run: npm run build

      - name: Commit lockfile and remove remediation workflow
        run: |
          rm .github/workflows/phase04-lockfile-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/phase04-lockfile-remediation.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh secure transitive dependencies"
          git push origin HEAD:feat/social-preview-cards
