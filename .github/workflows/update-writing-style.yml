name: Update writing style skill

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: apm-writing-style-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'svg153/blog' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout default branch
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install APM
        run: python -m pip install 'apm-cli==0.29.1'
      - name: Refresh and audit the skill
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          apm install --frozen --target agent-skills
          apm update --yes --target agent-skills
          apm install --frozen --target agent-skills
          apm audit --ci
          git diff --exit-code -- apm.yml
          git diff --check
      - name: Validate the update boundary
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys, yaml

          root = pathlib.Path('.agents/skills/svg153-writing-style')
          allowed = {'SKILL.md', 'apm.yml', 'metadata.yaml', 'references/style-examples.md'}
          directories = {'references'}
          if not root.is_dir() or root.is_symlink():
              sys.exit('Missing skill directory or unexpected symlink')
          actual = set()
          for entry in root.rglob('*'):
              relative = entry.relative_to(root).as_posix()
              if entry.is_symlink():
                  sys.exit(f'Symlink not allowed: {relative}')
              if entry.is_dir():
                  if relative not in directories:
                      sys.exit(f'Unexpected directory: {relative}')
              elif entry.is_file():
                  if relative not in allowed or entry.stat().st_mode & 0o111:
                      sys.exit(f'Unexpected or executable file: {relative}')
                  actual.add(relative)
              else:
                  sys.exit(f'Unexpected file type: {relative}')
          if actual != allowed:
              sys.exit(f'Unexpected skill files: {actual ^ allowed}')

          manifest = yaml.safe_load((root / 'apm.yml').read_text(encoding='utf-8'))
          dependencies = manifest.get('dependencies', {})
          if manifest.get('scripts') != {} or dependencies.get('apm') != [] or dependencies.get('mcp') != []:
              sys.exit('Unexpected skill scripts or dependencies')

          lock = yaml.safe_load(pathlib.Path('apm.lock.yaml').read_text(encoding='utf-8'))
          deps = lock.get('dependencies', [])
          expected = {root.as_posix()} | {(root / p).as_posix() for p in allowed}
          if len(deps) != 1:
              sys.exit('Unexpected number of APM dependencies')
          dep = deps[0]
          if (dep.get('host') != 'github.com' or dep.get('repo_url') != 'svg153/skills'
                  or dep.get('virtual_path') != 'skills/svg153-writing-style'
                  or not re.fullmatch(r'[0-9a-f]{40}', dep.get('resolved_commit', ''))
                  or set(dep.get('deployed_files', [])) != expected
                  or {x.get('value') for x in lock.get('deployments', [])} != expected):
              sys.exit('APM lock contains an unexpected source or deployed path')
          PY
      - name: Transfer only the managed skill and lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: writing-style-update
          path: |
            apm.lock.yaml
            .agents/skills/svg153-writing-style/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download the audited update from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: writing-style-update
          path: ${{ runner.temp }}/writing-style-update
      - name: Confirm the base has not moved
        env:
          EXPECTED_BASE: ${{ needs.prepare.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
      - name: Apply only managed files
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/writing-style-update"
          test -f "$source/apm.lock.yaml"
          test -f "$source/.agents/skills/svg153-writing-style/SKILL.md"
          if [ -n "$(find "$source" -type l -print -quit)" ]; then
            echo 'Symbolic links in the update are not allowed.' >&2
            exit 1
          fi
          mkdir -p .agents/skills
          rm -rf .agents/skills/svg153-writing-style
          cp -a "$source/.agents/skills/svg153-writing-style" .agents/skills/
          cp "$source/apm.lock.yaml" apm.lock.yaml
      - name: Open or update a reviewable PR
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ github.token }}
          branch: automation/apm-svg153-writing-style
          delete-branch: false
          add-paths: |
            apm.lock.yaml
            .agents/skills/svg153-writing-style
          commit-message: 'chore: update writing style skill via APM'
          title: 'chore: update writing style skill via APM'
          body: |
            This PR refreshes the writing style skill from svg153/skills via APM.
            Review the upstream changes, lockfile and deployed agent instructions
            before merging. APM audit passed in the read-only preparation job.
            GitHub may require approval before running workflows on this bot PR.
