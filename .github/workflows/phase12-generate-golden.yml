name: Generate Phase 12 dry-run golden

on:
  push:
    branches: [ feat/publishing-pipeline ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  golden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 branch
        uses: actions/checkout@v6
        with:
          ref: feat/publishing-pipeline

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate golden from actual CLI
        run: |
          mkdir -p scripts/fixtures/publishing
          node scripts/publish.mjs             --slug use-contribute-fork-build             --dry-run             > scripts/fixtures/publishing/use-contribute-fork-build.dry-run.json

      - name: Verify golden and full repository build
        run: |
          node scripts/validate-publishing.mjs
          npm run build

      - name: Commit reviewed golden and remove generator
        run: |
          rm .github/workflows/phase12-generate-golden.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fixtures/publishing/use-contribute-fork-build.dry-run.json .github/workflows/phase12-generate-golden.yml
          git commit -m "test: add canonical publishing dry-run golden"
          git push origin HEAD:feat/publishing-pipeline
